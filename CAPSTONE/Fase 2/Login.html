<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    .login {
      width: 100%;
      max-width: 380px;
      padding: 32px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgb(0 0 0 / 8%);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #64748b;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 20px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }

    input:focus {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:focus-visible {
      outline: 2px solid #1d4ed8;
      outline-offset: 3px;
    }

    .message {
      margin: 16px 0 0;
      font-size: 14px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <main class="login">
    <h1>Iniciar sesión</h1>
    <p class="subtitle">Ingresa tus datos para continuar.</p>

    <form id="login-form">
      <label for="email">Correo electrónico</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="correo@ejemplo.com"
        autocomplete="username"
        required
      >

      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        name="password"
        placeholder="Ingresa tu contraseña"
        autocomplete="current-password"
        required
      >

      <button type="submit">Entrar</button>
      <p id="message" class="message" role="status"></p>
    </form>
  </main>

  <script>
    document.getElementById("login-form")
      .addEventListener("submit", (event) => {
        event.preventDefault();

        document.getElementById("message").textContent =
          "Demo: conecta este formulario a tu servicio de autenticación.";
      });
  </script>
</body>
</html>
